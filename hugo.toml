# ===========================================================================
#  个人博客配置   Hugo + PaperMod
#  本地预览：hugo server -D     重新构建：hugo --gc --minify
# ===========================================================================

# ★★★ 第 1 步：部署成功后把这里换成你的真实网址 ★★★
#     例如 https://my-blog.pages.dev/  或  https://blog.你的域名.com/
baseURL = "https://euinblog.pages.dev/"

# ★★★ 第 2 步：改成你自己的博客名 ★★★
title = "我的博客"

theme = "PaperMod"

locale = "zh-CN"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

hasCJKLanguage = true               # 中文按「字数」统计，阅读时间更准确
enableRobotsTXT = true
enableEmoji = true
enableInlineShortcodes = true
pygmentsUseClasses = true           # 代码高亮必须用 class 模式，别改
buildDrafts = false
buildFuture = false
buildExpired = false

# 首页只展示 posts 栏目下的文章
mainSections = ["posts"]

[minify]
  disableXML = true

[pagination]
  pagerSize = 8                     # 每页显示几篇文章

# 分类 / 标签 / 系列
[taxonomies]
  category = "categories"
  tag      = "tags"
  series   = "series"

# home 里的 JSON 是站内搜索（Fuse.js）的索引，不要删
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ===========================================================================
#  站点参数
# ===========================================================================
[params]
  env         = "production"
  description = "记录技术、学习与生活。"
  author      = "博主"
  keywords    = ["博客", "技术", "笔记", "生活"]
  DateFormat  = "2006年01月02日"     # 日期显示格式
  defaultTheme = "auto"              # auto / light / dark

  ShowReadingTime   = true           # 显示阅读时间
  ShowWordCount     = true           # 显示字数
  ShowShareButtons  = false          # 分享按钮（默认是国外平台，中文博客一般关掉）
  ShowPostNavLinks  = true           # 上一篇 / 下一篇
  ShowBreadCrumbs   = true           # 面包屑导航
  ShowCodeCopyButtons = true         # 代码块一键复制
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true       # 归档页显示全部文章
  ShowPageNums      = true
  ShowToc           = true           # 文章目录
  TocOpen           = false          # 目录默认折叠
  comments          = false          # 不开启评论

  [params.assets]
    disableHLJS = true               # v8 起代码高亮改用 Hugo 自带 chroma

  # ---- 首页顶部自我介绍（支持 Markdown）----
  [params.homeInfoParams]
    Title = "你好，欢迎来到我的博客 👋"
    Content = """
欢迎来到我的个人博客，这里记录我的技术笔记、学习心得与生活随笔。

- 支持**分类**、**标签**、**归档**和**站内搜索**
- 点右上角的图标可以在浅色 / 深色主题间切换
- 想了解我，可以看看 [关于](/about/) 页面
"""

  # ---- 社交图标（可选，不需要就整段删掉）----
  # name 可选：github、email、bilibili、zhihu、juejin、douban、wechat、qq、
  #            x、youtube、telegram、rss、stackoverflow 等等
  [[params.socialIcons]]
    name  = "github"
    title = "GitHub"
    url   = "https://github.com/euinharry"

  [[params.socialIcons]]
    name  = "email"
    title = "给我发邮件"
    url   = "mailto:you@example.com"

  # ---- 站内搜索（Fuse.js）参数 ----
  [params.fuseOpts]
    isCaseSensitive    = false
    shouldSort         = true
    location           = 0
    distance           = 1000
    threshold          = 0.4
    minMatchCharLength = 1
    keys = ["title", "permalink", "summary", "content"]

  # ---- 每篇文章底部的「编辑此页」链接（不想显示就整段删掉）----
  [params.editPost]
    URL            = "https://github.com/euinharry/my-blog/edit/main/content"
    Text           = "在 GitHub 上编辑此页"
    appendFilePath = true

# ===========================================================================
#  顶部导航菜单
# ===========================================================================
[[menu.main]]
  name   = "归档"
  url    = "archives/"
  weight = 10

[[menu.main]]
  name   = "分类"
  url    = "categories/"
  weight = 20

[[menu.main]]
  name   = "标签"
  url    = "tags/"
  weight = 30

[[menu.main]]
  name   = "搜索"
  url    = "search/"
  weight = 40

[[menu.main]]
  name   = "关于"
  url    = "about/"
  weight = 50

# ===========================================================================
#  Markdown 渲染
# ===========================================================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true                  # 允许在 Markdown 里写 HTML
  [markup.highlight]
    noClasses = false